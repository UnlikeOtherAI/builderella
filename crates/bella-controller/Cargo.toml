[package]
name = "bella-controller"
description = "Controller: HTTP API, worker hub, dispatch loop and embedded dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
bella-core.workspace = true
bella-ledger.workspace = true
bella-scheduler.workspace = true
bella-store.workspace = true
bella-net.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
# HTTP stack. Default features stay off so that no TLS backend, compression
# library or form parser comes in that this crate does not use.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "ws"] }
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "http2", "server-auto", "server-graceful", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# TLS is terminated here with the `ring` provider that `bella-net` selects.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", default-features = false, features = ["io", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"

[dev-dependencies]
tempfile.workspace = true
# Test clients. reqwest gets its TLS configuration from `bella-net`, so it is
# built without a crypto provider of its own.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
