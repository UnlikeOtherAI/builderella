[package]
name = "bella-worker"
description = "Worker daemon: admission, attempt runner, logs and cleanup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bella-core.workspace = true
bella-journal.workspace = true
bella-protect.workspace = true
bella-probe.workspace = true
bella-contain.workspace = true
bella-materialize.workspace = true
bella-store.workspace = true
# Only for the private-file helpers that hold the machine token. This crate
# opens no socket and configures no TLS.
bella-net.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
